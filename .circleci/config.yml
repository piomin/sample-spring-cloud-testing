version: 2.1

jobs:
  analyze:
    executor:
      name: docker/machine
      image: ubuntu-2204:current
    steps:
      - checkout
      - git-shallow-clone/checkout_advanced:
          clone_options: '--filter=blob:none'
      - run:
          name: "Git fetch"
          command: git fetch --no-filter --refetch
      - docker/install-docker-compose
      - run:
          name: Run Pact Broker
          command: docker-compose up -d
      - maven/with_cache:
          steps:
            - run:
                name: Run Tests
                command: mvn clean package pact:publish -DskipTests
      - maven/with_cache:
          steps:
            - run:
                name: Sonar Analysis
                command: mvn package org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -DskipTests

executors:
  machine:
    machine:
      image: ubuntu-2204:current
    environment:
      architecture: "amd64"
      platform: "linux/amd64"

orbs:
  maven: circleci/maven@2.1.1
  docker: circleci/docker@2.8.2
  git-shallow-clone: guitarrapc/git-shallow-clone@2.8.0

workflows:
  maven_test:
    jobs:
      - analyze:
          context: SonarCloud
